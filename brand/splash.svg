<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="2778" viewBox="0 0 1284 2778">
  <defs>
    <linearGradient id="splashOceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143D46" />
      <stop offset="55%" stop-color="#11343C" />
      <stop offset="100%" stop-color="#0D272E" />
    </linearGradient>
    <radialGradient id="splashCoralGlow" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#F97066" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#143D46" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="badgeCoralGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97066" />
      <stop offset="100%" stop-color="#E04D43" />
    </linearGradient>
    <clipPath id="splashBadgeClip">
      <rect x="492" y="1020" width="300" height="300" rx="68" ry="68" />
    </clipPath>
    <filter id="badgeDropShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#081A1E" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Deep Ocean Teal backdrop -->
  <rect width="1284" height="2778" fill="url(#splashOceanBg)" />
  <rect width="1284" height="2778" fill="url(#splashCoralGlow)" />

  <!-- Centered Route-F rounded-square badge -->
  <g filter="url(#badgeDropShadow)">
    <g clip-path="url(#splashBadgeClip)">
      <rect x="492" y="1020" width="300" height="300" fill="url(#badgeCoralGrad)" />
      <g transform="translate(492, 1020) scale(0.29296875)" fill="#FFF5EE">
        <path d="M 237 526 C 236 420 237 338 262 296 C 296 238 380 218 525 204 L 784 184 C 804 182 811 193 806 213 C 795 256 774 303 744 331 C 728 345 706 349 664 352 L 460 364 C 344 371 268 416 244 504 C 241 516 238 524 237 526 Z" />
        <path d="M 238 528 C 254 486 308 463 402 454 L 728 434 C 746 433 753 443 748 463 C 737 506 716 547 686 567 C 668 579 642 581 598 584 L 444 592 C 396 595 379 612 379 658 L 379 746 C 379 814 342 846 276 846 L 245 846 C 238 846 235 843 235 836 L 235 612 C 235 568 236 538 238 528 Z" />
      </g>
    </g>
  </g>

  <!-- Brand wordmark -->
  <text
    x="642"
    y="1488"
    text-anchor="middle"
    font-family="Playfair Display, Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="144"
    letter-spacing="-2.5"
    fill="#FFF5EE"
  >Faroway</text>

  <!-- Descriptor -->
  <text
    x="642"
    y="1576"
    text-anchor="middle"
    font-family="Plus Jakarta Sans, 'Helvetica Neue', system-ui, sans-serif"
    font-weight="600"
    font-size="34"
    letter-spacing="9"
    fill="#C7D9D6"
  >AI TRAVEL PLANNER</text>
