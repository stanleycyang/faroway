name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun turbo type-check

      - name: Lint
        run: bun turbo lint

      - name: Format check
        run: bun turbo format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Calibrate offline planning-quality rubric
        run: python3 scripts/planning-quality-eval.py

      - name: Test trip lifecycle races in disposable PostgreSQL
        run: python3 scripts/test-trip-attempt-fence.py
        timeout-minutes: 5

      - name: Test privileged database boundaries in disposable PostgreSQL
        run: python3 scripts/test-database-access-boundaries.py
        timeout-minutes: 5

      - name: Rehearse complete staging bootstrap on PostgreSQL 17.11
        run: python3 scripts/test-staging-bootstrap.py
        timeout-minutes: 5

      - name: Rehearse isolated account and push release candidate
        run: python3 scripts/test-release-account-push.py
        timeout-minutes: 5

      - name: Install checkout test browser
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Test hosted checkout in desktop and mobile browsers
        run: bunx playwright test -c playwright.checkout.config.ts
        working-directory: apps/web

      - name: Test trip creation recovery and public sharing in the full app
        run: bunx playwright test -c playwright.recovery.config.ts
        working-directory: apps/web
        timeout-minutes: 15

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun turbo build --filter=@faroway/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
