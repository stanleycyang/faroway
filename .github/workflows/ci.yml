name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun turbo type-check

      - name: Lint
        run: bun turbo lint

      - name: Format check
        run: bun turbo format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  database-generation:
    name: PostgreSQL Generation Transactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install isolated-test PostgreSQL binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - name: Test real concurrency, rollback, fencing and privileges
        env:
          PG_TEST_BIN: /usr/lib/postgresql/16/bin
        run: node scripts/test-generation-transactions.mjs

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [quality, test, database-generation]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun turbo build --filter=@faroway/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install browser regression dependencies
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium webkit

      - name: Production contract browser regressions
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3107
        run: |
          bun run start --port 3107 > "$RUNNER_TEMP/faroway-browser-server.log" 2>&1 &
          browser_server_pid=$!
          trap 'kill "$browser_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$E2E_BASE_URL/tools/world-map" > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "$E2E_BASE_URL/tools/world-map" > /dev/null
          bunx playwright test e2e/world-map-backup.spec.ts e2e/api.spec.ts e2e/mobile-affiliate-checkout.spec.ts --grep 'editor notes|requires authentication|booking confirmation' --retries=0
