name: Rotate Apple Client Secret

# Runs on the 1st of every month + manual trigger
on:
  schedule:
    - cron: '0 9 1 * *' # 9am UTC on the 1st of each month
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  rotate:
    name: Rotate Apple OAuth Secret
    runs-on: ubuntu-latest
    steps:
      - name: Generate and update Apple client secret
        uses: actions/github-script@v7
        with:
          script: |
            const { SignJWT } = await import('jose');
            const { createPrivateKey } = await import('crypto');

            const teamId = '3H2N358EY5';
            const keyId = 'LQS687ZX25';
            const clientId = 'ai.tripgenie.web';
            const privateKeyPem = process.env.APPLE_P8_PRIVATE_KEY;
            const supabaseAccessToken = process.env.SUPABASE_ACCESS_TOKEN;
            const projectRef = process.env.SUPABASE_PROJECT_REF;

            if (!privateKeyPem || !supabaseAccessToken || !projectRef) {
              core.setFailed('Missing required secrets');
              return;
            }

            // Generate JWT (6 month expiry — Apple's maximum)
            const expirationTime = Math.ceil(Date.now() / 1000) + 86400 * 180;
            const secret = await new SignJWT({})
              .setAudience('https://appleid.apple.com')
              .setIssuer(teamId)
              .setIssuedAt()
              .setExpirationTime(expirationTime)
              .setSubject(clientId)
              .setProtectedHeader({ alg: 'ES256', kid: keyId })
              .sign(createPrivateKey(privateKeyPem));

            const expiryDate = new Date(expirationTime * 1000).toISOString().split('T')[0];
            core.info(`Generated Apple client secret, expires: ${expiryDate}`);

            // Update Supabase auth config via Management API
            const response = await fetch(
              `https://api.supabase.com/v1/projects/${projectRef}/config/auth`,
              {
                method: 'PATCH',
                headers: {
                  'Authorization': `Bearer ${supabaseAccessToken}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  external_apple_enabled: true,
                  external_apple_client_id: clientId,
                  external_apple_secret: secret,
                }),
              }
            );

            if (!response.ok) {
              const body = await response.text();
              core.setFailed(`Supabase API error ${response.status}: ${body}`);
              return;
            }

            core.info('Successfully updated Supabase Apple auth config');
        env:
          APPLE_P8_PRIVATE_KEY: ${{ secrets.APPLE_P8_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
