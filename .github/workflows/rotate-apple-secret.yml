name: Rotate Apple Client Secret

# Runs on the 1st of every month + manual trigger
on:
  schedule:
    - cron: "0 9 1 * *" # 9am UTC on the 1st of each month
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: rotate-apple-client-secret
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate Apple OAuth Secret
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Generate and update Apple client secret
        run: bun scripts/rotate-apple-secret.ts
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
          APPLE_P8_PRIVATE_KEY: ${{ secrets.APPLE_P8_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
