name: Release Verification

on:
  pull_request:
    branches: [main, codex/release-candidate]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release acceptance
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release/') ||
      contains(github.event.pull_request.labels.*.name, 'release-verification')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install test browser
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: Verify release without hosted credentials
        shell: bash
        run: bash scripts/verify-release-local.sh 2>&1 | tee release-verification.log
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            release-verification.log
            apps/web/test-results/
            apps/web/playwright-report/
