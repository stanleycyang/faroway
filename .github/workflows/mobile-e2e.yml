name: Mobile E2E

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  mobile-e2e-ios:
    name: Mobile E2E (iOS)
    runs-on: macos-15
    continue-on-error: ${{ vars.MOBILE_E2E_PHASE == '1' }} # Phase 1 non-blocking, Phase 2+ blocking
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      E2E_SEED_TOKEN: ${{ secrets.E2E_SEED_TOKEN }}
      E2E_MODE: 'true'
      E2E_PROFILE: 'default'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install applesimutils
        run: brew tap wix/brew && brew install applesimutils

      - name: Seed E2E fixtures
        run: bun run e2e:fixtures:seed

      - name: Detox build (iOS simulator)
        run: bun run e2e:detox:build:ios

      - name: Detox test (iOS simulator)
        run: bun run e2e:detox:test:ios:retry

      - name: Maestro smoke flows
        run: bun run e2e:maestro:test

      - name: Teardown E2E fixtures
        if: always()
        run: bun run e2e:fixtures:teardown

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts
          path: |
            apps/mobile/artifacts/**
            apps/mobile/e2e/artifacts/**
            apps/mobile/.maestro/**
